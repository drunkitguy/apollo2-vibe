---
name: Window-only release
permissions: {}

on:
  push:
    branches:
      - claude/clever-clarke-k7hhhj
      - vibepollo-base
    paths:
      - 'src/**'
      - 'tools/**'
      - 'tests/**'
      - 'cmake/**'
      - 'packaging/**'
      - 'plugins/**'
      - 'third-party/**'
      - 'CMakeLists.txt'
      - '.github/actions/**'
      - '.github/workflows/ci-windows.yml'
      - '.github/window-only-host-version.txt'
      - '.github/workflows/window-only-release.yml'

jobs:
  check:
    name: Check release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      asset: ${{ steps.version.outputs.asset }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: .github/window-only-host-version.txt
          sparse-checkout-cone-mode: false

      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < .github/window-only-host-version.txt)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::.github/window-only-host-version.txt must hold a version such as 1.0.0" >&2
            exit 1
          fi
          tag="window-host-v${version}"
          asset="Vibepollo-WindowOnly-${version}.msi"
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "asset=${asset}"
          } >> "${GITHUB_OUTPUT}"
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' 2> /dev/null |
            grep -Fxq "${asset}"; then
            echo "Release ${tag} already has ${asset}; skipping the build. Bump .github/window-only-host-version.txt for a new release."
            echo "publish=false" >> "${GITHUB_OUTPUT}"
          else
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          fi

  windows:
    name: Windows
    needs: check
    if: needs.check.outputs.publish == 'true'
    # A newer push supersedes a build in progress; publishing has its own group below.
    concurrency:
      group: window-only-build-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/ci-windows.yml
    with:
      build_only: false
      build_tests: true
      run_window_only_tests: true
      # A build that crashes at startup must never be released.
      run_startup_smoke: true
      # Upstream releases are not updates for this build.
      disable_update_check: true
      release_commit: ${{ github.sha }}
      release_version: ${{ needs.check.outputs.version }}
      release_artifact_retention_days: 7
      symbol_product_name: Vibepollo
      symbol_release_prefix: polo
      publish_symbols: false
      require_truehdr_runtime: false

  release:
    name: Release
    needs: [check, windows]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Never cancelled midway, so a release is never left without its MSI.
    concurrency:
      group: window-only-publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check release again
        id: recheck
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          ASSET: ${{ needs.check.outputs.asset }}
        run: |
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' 2> /dev/null |
            grep -Fxq "${ASSET}"; then
            echo "Release ${TAG} already has ${ASSET}; nothing to publish."
            echo "publish=false" >> "${GITHUB_OUTPUT}"
          else
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          fi

      # The package artifact is a regular archive holding the MSI; the SignPath
      # upload uses archive: false and is named after the file instead.
      - name: Download MSI
        if: steps.recheck.outputs.publish == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: unsigned-msi-package-Windows
          path: artifact

      - name: Prepare release files
        if: steps.recheck.outputs.publish == 'true'
        env:
          ASSET: ${{ needs.check.outputs.asset }}
        run: |
          mapfile -t msis < <(find artifact -type f -name '*.msi')
          if (( ${#msis[@]} != 1 )); then
            echo "::error::Expected exactly one MSI in the artifact, found ${#msis[@]}" >&2
            exit 1
          fi
          mkdir -p dist
          name="${ASSET}"
          cp "${msis[0]}" "dist/${name}"
          (cd dist && sha256sum "${name}" > "${name}.sha256")
          ls -l dist

      - name: Publish release
        if: steps.recheck.outputs.publish == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Vibepollo window-only host ${{ needs.check.outputs.version }}
          files: dist/*
          fail_on_unmatched_files: true
          make_latest: true
          generate_release_notes: false
          body: |
            Vibepollo host build with window-only capture. When a client asks for it, the stream shows only the window of the app launched from the client. The Windows desktop, taskbar, notifications and other windows are replaced by black.

            ## What's new in 1.3

            These changes target streaming over Wi-Fi. Each new default has a line for `sunshine.conf` in the `config` folder of the install directory that brings back the 1.2.2 behaviour; restart the host after adding it. Both options are also on the Network page of the web UI.

            - Video pacing: each video frame is now sent at 4 times the stream bitrate, kept between 300 and 800 Mbps, instead of always at 800 Mbps. A 100 Mbps stream is sent at 400 Mbps, which Wi-Fi access points deliver more evenly. To go back, add `pacing_mode = legacy`. A `pacing_max_bitrate_kbps` value you set yourself still wins over both modes.
            - Audio QoS: for clients that ask for QoS tagging, audio packets are now tagged like video instead of as voice. Some Wi-Fi access points drop or delay packets in their voice queue under load, which can be heard as crackling audio. To go back, add `audio_qos = voice`. `audio_qos = off` sets no tag on audio.
            - The capture helper no longer exits when Windows refuses the realtime GPU priority, for example for a user without the privilege to raise priorities. It enables that privilege when the account holds it, falls back to high GPU priority, and otherwise keeps the default. The stream starts either way.
            - At the debug log level, the host and the capture helper log every 20 seconds how long the window capture copy path waits for and copies each frame.

            How much the pacing and audio changes help depends on the network. If a stream gets worse after the update, compare with `pacing_mode = legacy` and `audio_qos = voice` on that network.

            ## What's new in 1.2

            - Menus, dropdowns, tooltips, context menus and dialogs of the launched app now appear in the stream at their true position and in their true stacking order, including file pickers and dialogs opened from other dialogs.
            - Dialogs no longer replace the main window in the stream and no longer restart capture; they are drawn over it.
            - Each of these windows is captured on its own, so other apps, the desktop, the taskbar and system UI stay hidden even when they lie over the app.
            - Dialogs that open mostly off the streamed display are moved onto it once. Menus and popups are never moved.
            - 1.2.2: the helper no longer wakes its recomposite thread on every frame while no popup is shown.
            - 1.2.1: starting or resuming a stream no longer takes the focus away from a dialog the app is showing; when the app is in the background, its open dialog gets the focus instead of the disabled main window. A separate window of the same app that the user switches to, such as a game window opened next to a game list, becomes the streamed window again.

            To go back to showing only the app's main window, add the line `window_only_secondary_windows = disabled` to `sunshine.conf` in the `config` folder of the install directory, then restart the host. With that setting the host behaves exactly like 1.1.1, including which window is streamed.

            ## Install

            1. Install `Vibepollo-WindowOnly-${{ needs.check.outputs.version }}.msi` on the Windows PC. The MSI is not code signed, so SmartScreen may warn: choose "More info", then "Run anyway". The `.sha256` file lets you check the download.
            2. Pair it with the Vibe Window Android client from https://github.com/drunkitguy/vibe-window/releases and keep "Show only the app window" turned on in the client settings.

            Clients that do not send the window-only flag stream the whole display exactly as before.

            ## Library systems

            The app list now tells the client which system each app belongs to, such as PC, Nintendo Switch or Apps, so Vibe Window 1.1.0 and later can group the library by system. Older clients ignore this and behave as before.

            Playnite games need the updated Playnite connector (0.5.0 or newer; this build ships 0.5.1) before they get a system:

            1. Open the host web UI, go to the Integrations page and update the Playnite plugin.
            2. Restart Playnite.
            3. Wait for one library snapshot. Playnite sends it shortly after it starts, and the host then fills in the system of every synced game.

            Until then, Playnite games have no system and the client lists them under PC. Desktop, the Playnite launcher and other entries without a command are listed under Apps. To put an app in a group by hand, add a `"platform"` value to it in apps.json; it takes priority over Playnite data, and the Playnite sync never changes it.

            ## Known limitations

            - Windows of the app are shown, including menus, dropdowns and dialogs. Prompts hosted by Windows itself in other processes (credential prompts, the Open with picker, the emoji panel) stay black.
            - Translucent menu edges may show a thin black border. Large see-through overlay windows of the app are not shown, so they cannot cover it with black.
            - A large translucent dropdown or popup without a frame that covers more than half of a small app window may be hidden for the same reason.
            - A smaller dialog window of the app that has no owner is drawn over the main window instead of replacing it. Larger windows of the app, and windows that are not dialogs, still become the streamed window as before.
            - Prompts that Windows shows in its own processes on behalf of the app (for example a sign-in prompt that belongs to the app window) stay black. In 1.1.1 such a prompt replaced the app window in the stream.
            - Windows whose owner window is hidden can now become the streamed window; in 1.1.1 they only could while they were in the foreground.
            - Menus of Store apps that open in separate frame windows are not shown.
            - A brand-new popup can appear a few frames after it opens on the host. Popups that open again appear without that delay.
            - Menus and dialogs of another app that starts after the launch are not shown; that app's main window is shown only when it becomes the streamed window, as before.
            - Games in legacy exclusive fullscreen may produce no picture. Use borderless or windowed fullscreen.
            - UAC prompts and the lock screen are shown as the secure desktop so they can be answered; the stream returns to the window afterwards.
            - Switching from a launcher to the game window freezes the picture for about a second while capture restarts.
            - Audio is still the whole system mix.
            - A window-only stream and a regular stream cannot run at the same time; the host refuses the second one.
            - Resizable windows are sized to fill the display. A fixed-size window smaller than the display leaves a black margin, and taps or clicks on that margin still reach whatever lies there on the host.
            - Update notifications are turned off in this build; check this repository's releases for new versions.

            Source code is in this repository under GPL-3.0.
